services:
  todo-api:
    container_name: todo-api
    # TAG vient de l'environnement, jamais du fichier : c'est ce qui rend le retour arrière
    # possible sans rebuild. Non défini, le déploiement échoue au lieu de partir au hasard.
    image: ovbd/todo-api:${TAG:?TAG est requis (le sha du commit a deployer)}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: todo-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      todo-db:
        condition: service_healthy

  todo-db:
    container_name: todo-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    container_name: grafana
    image: grafana/grafana:12.4.7
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Lecture sans mot de passe : en phase 10 le pilote doit ouvrir le tableau de bord
      # sans avoir a demander d'identifiants a la personne en panne.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  todo-db-data:
  prometheus-data:
  grafana-data:
