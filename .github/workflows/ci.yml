name: CI/CD Todo API

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        ports:
          - 5432:5432
        # Sans ce healthcheck, le job demarre avant que PostgreSQL accepte les connexions
        # et les tests echouent au hasard.
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests d'intégration sur une vraie base
        run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: todo_test
          DB_USER: todo
          DB_PASSWORD: todo

  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}

  deploy:
    needs: [build]
    # Seul job à tourner chez moi : le runner GitHub est dans un datacenter et ne peut pas
    # joindre la machine cible derrière ma box.
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # L'agent garde la clé en mémoire : rien n'est écrit sur le disque du runner.
      - name: Charger la clé de déploiement dans l'agent SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Vérifier que les secrets de déploiement sont présents
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          manquants=""
          [ -z "$DEPLOY_HOST" ] && manquants="$manquants DEPLOY_HOST"
          [ -z "$DEPLOY_PORT" ] && manquants="$manquants DEPLOY_PORT"
          [ -z "$DEPLOY_USER" ] && manquants="$manquants DEPLOY_USER"
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) absent(s) ou mal orthographie(s) :$manquants — verifier Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "les trois secrets de connexion sont renseignes"

      - name: Faire confiance à la machine cible
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Envoyer la configuration sur la machine cible
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'mkdir -p /srv/todo'
          scp -P "${{ secrets.DEPLOY_PORT }}" -r compose.yml prometheus.yml grafana \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/"

      - name: Déployer la version de ce commit
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/todo && TAG=${{ github.sha }} docker compose up -d --remove-orphans"

      - name: Vérifier que l'API répond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.DEPLOY_HOST }}:3000/health"; then
              echo "" && echo "API en ligne apres ${i} tentative(s)"
              exit 0
            fi
            sleep 2
          done
          echo "L'API ne repond pas sur /health apres 60 s"
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'docker compose -f /srv/todo/compose.yml ps; docker logs --tail 30 todo-api'
          exit 1
