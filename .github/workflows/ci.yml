name: CI/CD Todo API

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        ports:
          - 5432:5432
        # Sans ce healthcheck, le job demarre avant que PostgreSQL accepte les connexions
        # et les tests echouent au hasard.
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests d'intégration sur une vraie base
        run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: todo_test
          DB_USER: todo
          DB_PASSWORD: todo

  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}

  deploy:
    needs: [build]
    # Le runner et le cluster partagent la meme machine : ni cle SSH ni secret
    # supplementaire, kubectl lit le kubeconfig que k3d a ecrit a la creation.
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      NAMESPACE: todo
      DEPLOIEMENT: todo-api
      KUBECONFIG: /home/ybont/.kube/config

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le runner parle au bon cluster
        run: |
          kubectl config use-context k3d-todo-cluster
          kubectl get namespace "$NAMESPACE"

      - name: Déployer la version de ce commit
        run: |
          kubectl set image "deployment/$DEPLOIEMENT" \
            "$DEPLOIEMENT=${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}" \
            -n "$NAMESPACE"

      - name: Attendre la convergence du rollout
        run: |
          if ! kubectl rollout status "deployment/$DEPLOIEMENT" -n "$NAMESPACE" --timeout=120s; then
            echo "::error::Le rollout n'a pas converge en 120 s"
            kubectl get pods -n "$NAMESPACE" -l app="$DEPLOIEMENT"
            kubectl describe deployment "$DEPLOIEMENT" -n "$NAMESPACE" | tail -20
            kubectl logs -n "$NAMESPACE" -l app="$DEPLOIEMENT" --tail=30 --previous || true
            exit 1
          fi

      - name: Vérifier que l'API répond par sa vraie porte d'entrée
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -H "Host: todo.localhost" http://localhost:8080/health; then
              echo "" && echo "API en ligne apres ${i} tentative(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::L'API ne repond pas sur /health via l'Ingress apres 30 s"
          kubectl get ingress,svc,endpoints -n "$NAMESPACE"
          exit 1
