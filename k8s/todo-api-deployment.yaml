apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
  labels:
    app: todo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          # Le sha du commit, jamais latest : c'est ce qui rend le retour arrière possible.
          image: ovbd/todo-api:aab934acd7d9a1282d80509cd43199292350817b
          ports:
            - containerPort: 3000
          # envFrom déverse toutes les clés des deux objets d'un coup : l'API attend
          # déjà DB_HOST, DB_USER, DB_PASSWORD sous ces noms depuis le Jour 1.
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
