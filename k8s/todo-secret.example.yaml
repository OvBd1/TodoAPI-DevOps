# Modèle du Secret du namespace todo. Le vrai fichier, k8s/todo-secret.yaml,
# porte le mot de passe et n'est jamais versionné (voir .gitignore).
#
#   cp k8s/todo-secret.example.yaml k8s/todo-secret.yaml
#   # remplacer la valeur de DB_PASSWORD, puis :
#   kubectl apply -f k8s/todo-secret.yaml
#
# stringData plutôt que data : Kubernetes accepte du texte en clair et se charge
# lui-même de l'encoder en base64 au moment de l'enregistrer.
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  # DB_NAME vit ici, et pas dans le ConfigMap, parce que le Deployment de la base
  # (todo-db.yaml) le lit par secretKeyRef en même temps que l'utilisateur et le mot de passe.
  DB_NAME: todo
  DB_USER: todo
  DB_PASSWORD: remplacer-par-un-mot-de-passe-genere
