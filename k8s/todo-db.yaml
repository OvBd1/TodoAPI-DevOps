apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-db-data
  namespace: todo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-db
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-db
  template:
    metadata:
      labels:
        app: todo-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # subPath : sans lui, Postgres refuse de démarrer sur le lost+found du volume.
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: todo-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: todo-db
  namespace: todo
spec:
  selector:
    app: todo-db
  ports:
    - port: 5432
      targetPort: 5432
